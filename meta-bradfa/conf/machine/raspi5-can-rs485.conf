#@TYPE: Machine
#@NAME: RaspberryPi 5 with CAN & dual RS-485 hat
#@DESCRIPTION: Machine configuration for the RaspberryPi 5 in 64 bits mode

include conf/machine/raspberrypi5.conf

# The mcp2515-can0.dtbo is already included from rpi-base.inc
RPI_KERNEL_DEVICETREE_OVERLAYS += " \
    overlays/sc16is752-spi1.dtbo \
"

# We do have an RTC on Raspberry Pi 5, so leave this blank
MACHINE_FEATURES_BACKFILL_CONSIDERED = ""

KBUILD_DEFCONFIG = "bcm2712_defconfig"

# Add the serial MACHINE_FEATURE
MACHINE_FEATURES += "serial"

# Add our needed CAN and RS-485 kernel modules
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    kernel-module-mcp251x \
    kernel-module-sc16is7xx \
"
