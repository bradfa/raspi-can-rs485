# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bradfa"
BBFILE_PATTERN_meta-bradfa = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bradfa = "6"

LAYERDEPENDS_meta-bradfa = "core"
LAYERSERIES_COMPAT_meta-bradfa = "scarthgap"
